before_script:
    - echo '*** Install packages needed by andorSdk3 ***'
    - . /etc/os-release
    - export REL_OS_NAME=${NAME%% *}
    - >
      if [ "$REL_OS_NAME" = "CentOS" -o "$REL_OS_NAME" = "AlmaLinux" -o "$REL_OS_NAME" = "Red" ]; then
        yum install -y kernel-headers
      elif [ "$REL_OS_NAME" = "Ubuntu" ]; then
        apt-get update
        apt-get install -y linux-headers-generic
        # needed to build andor's bitflow
        export KERN_DIR=`find /usr/src/ -name linux-headers-*-generic -type d | head -1`
      fi;

include:
  - project: karabo/gitlabci
    file: .python-ci.yml
    ref: main
